<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spoil It settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <header><p class="brand">Spoil It</p><h1>Settings</h1></header>
    <p class="intro">Connect the services Spoil It uses to reveal what happens in a video.</p>

    <div class="settings-card">
    <section>
        <label for="youtube-key">YouTube Data API key</label>
        <div class="key-row">
            <input id="youtube-key" type="password" autocomplete="off" spellcheck="false" placeholder="Used for comments">
            <button class="toggle" type="button" data-target="youtube-key">Show</button>
        </div>
    </section>

    <section>
        <label for="openai-key">OpenAI API key</label>
        <div class="key-row">
            <input id="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="Used for AI analysis">
            <button class="toggle" type="button" data-target="openai-key">Show</button>
        </div>
    </section>

    <section>
        <label for="supadata-key">Supadata transcription API key</label>
        <div class="key-row">
            <input id="supadata-key" type="password" autocomplete="off" spellcheck="false" placeholder="Used for captions and speech-to-text">
            <button class="toggle" type="button" data-target="supadata-key">Show</button>
        </div>
    </section>

    <button id="save" class="primary" type="button">Save keys locally</button>
    <p id="status" role="status" aria-live="polite"></p>
    </div>

    <aside>
        <strong>Stored on this device</strong>
        <p>Your keys stay in this Chrome profile. Video details, comments, and a transcript are shared only with the connected services when you choose “Spoil this video.”</p>
    </aside>
</main>
<script src="popup.js"></script>
</body>
</html>
