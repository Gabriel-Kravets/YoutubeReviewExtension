<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spoil It settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <p class="eyebrow">Spoil It</p>
    <h1>Analysis settings</h1>
    <p class="intro">Supadata transcribes the video; OpenAI turns the transcript into the final report.</p>
    <div class="field">
        <label for="openai-key">OpenAI API key</label>
        <div class="key-row">
            <input id="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your OpenAI key">
            <button class="secondary toggle" data-target="openai-key" type="button">Show</button>
        </div>
    </div>
    <div class="field">
        <label for="supadata-key">Supadata API key</label>
        <div class="key-row">
            <input id="supadata-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Supadata key">
            <button class="secondary toggle" data-target="supadata-key" type="button">Show</button>
        </div>
    </div>
    <button id="save-key" class="primary" type="button">Save locally</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="privacy">Keys remain in this Chrome profile. Public releases require a secure backend instead of user-supplied provider keys.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
