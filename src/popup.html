<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <p class="eyebrow">Preview</p>
    <h1>Gemini settings</h1>
    <p class="intro">Use your own Gemini API key during local development.</p>
    <label for="gemini-key">Gemini API key</label>
    <div class="key-row">
        <input id="gemini-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
        <button id="show-key" class="secondary" type="button">Show</button>
    </div>
    <button id="save-key" class="primary" type="button">Save locally</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="privacy">The key remains in this Chrome profile. Public releases require a secure backend instead of an embedded key.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
