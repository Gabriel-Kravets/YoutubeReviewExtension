<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spoil It settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
    <header><p class="brand">Spoil It</p><h1>Settings</h1></header>
    <p class="intro">Connect the services Spoil It uses to reveal what happens in a video.</p>
    <div class="settings-card">
    <div class="field">
        <label for="openai-key">OpenAI API key</label>
        <div class="key-row">
            <input id="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your OpenAI key">
            <button class="secondary toggle" data-target="openai-key" type="button">Show</button>
        </div>
    </div>
    <div class="field">
        <label for="supadata-key">Supadata API key</label>
        <div class="key-row">
            <input id="supadata-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Supadata key">
            <button class="secondary toggle" data-target="supadata-key" type="button">Show</button>
        </div>
    </div>
    <button id="save-key" class="primary" type="button">Save locally</button>
    <p id="status" role="status" aria-live="polite"></p>
    </div>
    <aside><strong>Stored on this device</strong><p>Keys remain in this Chrome profile and are used only when you analyze a video.</p></aside>
</main>
<script src="popup.js"></script>
</body>
</html>
